services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      CI_ENVIRONMENT: development
    # Garante permissões de escrita no writable/ (o Apache roda como www-data)
    command: sh -c "chmod -R 777 /var/www/html/writable && apache2-foreground"
    depends_on:
      - db

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: aassc
      MARIADB_USER: aassc
      MARIADB_PASSWORD: aassc
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

volumes:
  db_data:
