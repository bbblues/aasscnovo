# Stack de produção (VPS KingHost).
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Requer um `.env` na raiz (copie de `.env.production.example`).
services:
  web:
    build:
      context: .
      dockerfile: docker/php/prod.Dockerfile
    restart: unless-stopped
    # Porta interna apenas; o Nginx (abaixo) é a única porta pública.
    expose:
      - "80"
    volumes:
      - ./:/var/www/html
      # Volume nomeado: preserva logs/cache/sessões entre rebuilds e evita
      # conflitos de permissão no diretório writable/ do host.
      - app_writable:/var/www/html/writable
    env_file:
      - .env
    environment:
      CI_ENVIRONMENT: production
    command: sh -c "mkdir -p /var/www/html/writable/cache /var/www/html/writable/logs /var/www/html/writable/session /var/www/html/writable/debugbar && chown -R www-data:www-data /var/www/html/writable && apache2-foreground"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    # A porta 3306 NÃO é exposta publicamente — acessível só na rede interna.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  db_data:
  app_writable:
